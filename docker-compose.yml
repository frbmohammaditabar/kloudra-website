services:
  kloudra-site:
    build: .
    container_name: kloudra-site
    restart: unless-stopped
    expose:
      - "80"

  careers-api:
    build: ./careers-api
    container_name: kloudra-careers-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - careers_uploads:/app/uploads
    expose:
      - "5000"

  caddy:
    image: caddy:2-alpine
    container_name: kloudra-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kloudra-site
      - careers-api

volumes:
  caddy_data:
  caddy_config:
  careers_uploads:
